# 研究版：多因子补 Quality 一极（AQR QMJ 思路）。在 multi_factor_v2
# （Value+Momentum+LowVol）上加入质量因子，验证与价值互补性。
# 注意：multi_factor_v2 为正式保留配置，不得改动；本文件为对照研究配置。
alpha_id: multi_factor_quality_v2
version: 1
market_scope: cn_equity
factors:
  - {profile_id: earnings_yield_v2, weight: 0.20, critical: false}
  - {profile_id: book_to_price_v2, weight: 0.15, critical: false}
  - {profile_id: momentum_252d_skip21_v2, weight: 0.25, critical: true}
  - {profile_id: low_volatility_20d_v2, weight: 0.20, critical: false}
  - {profile_id: quality_roe_v1, weight: 0.20, critical: false}
minimum_coverage: 0.60
minimum_valid_factor_count: 2
formal_maturity_policy: force_mature_after_observation
