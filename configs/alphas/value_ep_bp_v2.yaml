# 价值(E/P + B/P):Graham/AQR-Fama-French 价值。盈利收益率 + 账面市值比。
# book_to_price 覆盖 99% 作 critical;earnings_yield 亏损股缺失(P E<=0)时不阻塞。
alpha_id: value_ep_bp_v2
version: 1
market_scope: cn_equity
factors:
  - {profile_id: earnings_yield_v2, weight: 0.6, critical: false}
  - {profile_id: book_to_price_v2, weight: 0.4, critical: true}
minimum_coverage: 0.50
minimum_valid_factor_count: 1
formal_maturity_policy: force_mature_after_observation
