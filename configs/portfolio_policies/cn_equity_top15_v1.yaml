# 组合政策:红利低波 top15 等权、月调。
# 只决定选股与权重;不修改 strategy_score,不做风险覆盖。
portfolio_policy_id: cn_equity_top15_v1
version: 1
rebalance: monthly
selection: {method: top_n_above_score, n: 15, minimum_score: 60}
weighting: equal
max_single_weight: 0.08
max_gross: 0.95
min_amount_20d: 20000000        # 20 日均成交额 ≥ 2 千万(容量门禁)
minimum_listing_days: 252       # 上市满 1 年(避开次新股)
max_industry_weight: 0.30       # 单行业上限(首版仅记录,未硬约束)
