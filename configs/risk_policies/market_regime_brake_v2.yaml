# 进攻策略调参版 4（最终）：market_regime_brake_v2（均线 + 波动率 + 回撤刹车三保险）。
# 针对 2015 股灾（2015-06-08→2016-01-28 回撤 49%）的完整风控组合：
#   - market regime：MA200 + enter 3% + 压 45%（防牛市假信号，慢变量）；
#   - volatility target 0.25（近 63 日实现波动率 >25% 等比压仓，floor 30%）；
#   - drawdown_brake 0.20 → scale 0.50：自身权益回撤 20% 即压半仓（不依赖均线，
#     2015 年 6 月底即触发），回撤降到 10% 以下才恢复（滞回防 whipsaw）。
# 依赖 2026-08-14 引擎修复：风险压仓时 rebalancer 豁免最小持仓软锁/max_replace/drift
# （docs/SPECS/growth-offense-gate-results.md §8），否则压仓被执行层吞掉。
