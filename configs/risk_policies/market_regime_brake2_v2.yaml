# 进攻策略调参版 5：market_regime_brake2_v2（brake 恢复改滚动新高）。
# 基于 market_regime_brake_v2，仅改恢复条件：
#   - drawdown_recover_dd 0.10 → drawdown_recover_high_days=63：
#     权益创 63 日新高即解除压仓（下跌中反弹也能及时解锁）。
#     原 0.10 恢复线在 2015 股灾后 dd 长期 0.28-0.33 徘徊（压仓→涨不快→
#     不恢复→永久锁死，brake 触发 1102/1702 天），导致 2016-2019 长期 36-49%
#     低仓、超额 -31.77%。滚动新高让 2015 Q4 / 2016 反弹 / 2018 反弹及时解锁。
