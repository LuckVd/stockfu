# 趋势跟踪专用风险政策:截断亏损、让利润奔跑(经典趋势系统准则)。
# - 较紧个股止损(10%):趋势交易快速认错;
# - 分段追踪止盈(浮盈后按高点回撤卖出):让赢家跑;
# - 沪深300 MA200 regime:大盘跌破趋势线时压缩敞口(不在熊市追趋势);
# - 组合回撤刹车:整体回撤时降仓。
