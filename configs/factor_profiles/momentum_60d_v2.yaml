# 行业轮动·中期动量(60 日,不含 skip):近 3 个月涨幅,高 → 高分。
# 指数资产专用:无 industry_history 分量(避免行业自循环),market/self 分位对 31 个
# 申万一级行业截面计算;absolute knots 域按短窗动量收窄。
profile_id: momentum_60d_v2
version: 1
raw_metric:
  id: momentum_60d
  params: {window: 60, skip: 0, price_basis: qfq, metric_id: momentum_60d}
direction: higher_is_better
raw_unit: percent
mapping:
  mode: hybrid
  components:
    absolute:
      weight: 0.5
      knots: [[-30, 0], [-15, 20], [0, 50], [15, 72], [30, 85], [50, 95], [80, 100]]
    market_history:
      weight: 0.3
      state: rolling
      years: 3
      sampling: weekend_cross_section
      min_observations: 3000
    self_history:
      weight: 0.2
      state: rolling
      years: 3
      sampling: month_end
      min_observations: 24
formal_requires_mature: true
missing_policy: shrink_to_50_and_block_if_critical
valid_from: 2013-01-01
