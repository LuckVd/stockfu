# JOR 盈余跳空:公告后首日跳空,低(低开/平开)→ 高分。IC 两段一致负
# (-0.014~-0.018@5d):公告日高开=利好兑现,追高跑输。事件因子,窗外缺失。
profile_id: jor_low_v2
version: 1
raw_metric:
  id: jor
  params: {hold_days: 63, basis: raw}
direction: lower_is_better
raw_unit: percent
mapping:
  mode: hybrid
  components:
    absolute:
      weight: 0.5
      knots: [[-8, 100], [-4, 82], [-1.5, 65], [0, 50], [1.5, 35], [4, 18], [8, 0]]
    market_history:
      weight: 0.3
      state: rolling
      years: 3
      sampling: weekend_cross_section
      min_observations: 3000
    self_history:
      weight: 0.2
      state: rolling
      years: 3
      sampling: month_end
      min_observations: 24
formal_requires_mature: true
missing_policy: shrink_to_50_and_block_if_critical
valid_from: 2013-01-01
