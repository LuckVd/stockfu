# 阶段二候选：提高绝对股息率 mapping 权重，降低市场/个股历史归一化影响。
profile_id: dividend_yield_ttm_abs75_v2
version: 1
raw_metric:
  id: dividend_yield_ttm
  params: {price_basis: raw, trailing_days: 365, no_dividend_policy: zero}
direction: higher_is_better
raw_unit: percent
mapping:
  mode: hybrid
  components:
    absolute:
      weight: 0.75
      knots: [[0, 0], [1, 20], [2, 40], [3, 50], [5, 75], [8, 90], [12, 100]]
    market_history:
      weight: 0.15
      state: rolling
      years: 10
      sampling: month_end_cross_section
      min_observations: 3000
    self_history:
      weight: 0.10
      state: rolling
      years: 5
      sampling: month_end
      min_observations: 24
formal_requires_mature: true
missing_policy: shrink_to_50_and_block_if_critical
valid_from: 2007-01-01
