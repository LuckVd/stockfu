# 行业轮动·长期反转(250 日,不含 skip):近 1 年涨幅,低 → 高分(反转/均值回归)。
# 中银"长期反转-中期动量-低拥挤"的长期反转极;direction=lower_is_better 由 profile 控制,
# 复用 momentum raw(window=250)。指数资产专用,无 industry_history 分量。
profile_id: momentum_250d_rev_v2
version: 1
raw_metric:
  id: momentum_250d
  params: {window: 250, skip: 0, price_basis: qfq, metric_id: momentum_250d}
direction: lower_is_better
raw_unit: percent
mapping:
  mode: hybrid
  components:
    absolute:
      weight: 0.5
      knots: [[-80, 100], [-40, 85], [0, 72], [40, 50], [80, 20], [120, 0]]
    market_history:
      weight: 0.3
      state: rolling
      years: 3
      sampling: weekend_cross_section
      min_observations: 3000
    self_history:
      weight: 0.2
      state: rolling
      years: 3
      sampling: month_end
      min_observations: 24
formal_requires_mature: true
missing_policy: shrink_to_50_and_block_if_critical
valid_from: 2013-01-01
