# V2 点时行业不可用时的红利率 profile。
# 相对 v1 移除 industry_history；非点时行业数据不得参与历史评分。
# 窗口内确认没有现金分红时，raw 因子按有效 0% 处理；只有价格等原始字段缺失才阻塞。
profile_id: dividend_yield_ttm_v2
version: 2
raw_metric:
  id: dividend_yield_ttm
  params: {price_basis: raw, trailing_days: 365, no_dividend_policy: zero}
direction: higher_is_better
raw_unit: percent
mapping:
  mode: hybrid
  components:
    absolute:
      weight: 0.5882352941176471
      knots: [[0, 0], [1, 20], [2, 40], [3, 50], [5, 75], [8, 90], [12, 100]]
    market_history:
      weight: 0.29411764705882354
      state: rolling
      years: 10
      sampling: month_end_cross_section
      min_observations: 3000
    self_history:
      weight: 0.11764705882352941
      state: rolling
      years: 5
      sampling: month_end
      min_observations: 24
formal_requires_mature: true
missing_policy: shrink_to_50_and_block_if_critical
valid_from: 2007-01-01
