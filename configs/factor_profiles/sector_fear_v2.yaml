# 行业轮动·恐慌情绪(0-100 自身滚动分位):fear 高 → 高分。
# 口径同 probes/sector_rotation.compute_sentiment(高波+下跌 → 高恐);
# absolute knots 为恒等映射(值本身即分位),market 分量做行业间相对比较。
profile_id: sector_fear_v2
version: 1
raw_metric:
  id: sector_fear
  params: {vol_window: 20, chg_window: 5}
direction: higher_is_better
raw_unit: percentile_0_100
mapping:
  mode: hybrid
  components:
    absolute:
      weight: 0.5
      knots: [[0, 0], [25, 25], [50, 50], [75, 75], [100, 100]]
    market_history:
      weight: 0.3
      state: rolling
      years: 3
      sampling: weekend_cross_section
      min_observations: 3000
    self_history:
      weight: 0.2
      state: rolling
      years: 3
      sampling: month_end
      min_observations: 24
formal_requires_mature: true
missing_policy: shrink_to_50_and_block_if_critical
valid_from: 2013-01-01
