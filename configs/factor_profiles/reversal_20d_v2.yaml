# 短期反转(Jegadeesh-Lehmann 1990):近 20 日收益,低(近期下跌)→ 看多。
# 复用 momentum raw_metric(window=20, skip=0),direction=lower_is_better。
profile_id: reversal_20d_v2
version: 1
raw_metric:
  id: momentum
  params: {window: 20, skip: 0, price_basis: qfq, metric_id: momentum}
direction: lower_is_better
raw_unit: percent
mapping:
  mode: hybrid
  components:
    absolute:
      weight: 0.5
      knots: [[-30, 100], [-15, 80], [-5, 60], [0, 50], [5, 40], [15, 20], [30, 0]]
    market_history:
      weight: 0.3
      state: rolling
      years: 3
      sampling: weekend_cross_section
      min_observations: 3000
    self_history:
      weight: 0.2
      state: rolling
      years: 3
      sampling: month_end
      min_observations: 24
formal_requires_mature: true
missing_policy: shrink_to_50_and_block_if_critical
valid_from: 2007-01-01
