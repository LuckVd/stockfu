# 行业轮动·低拥挤代理(60 日已实现波动率):高波 → 低分。
# 拥挤度用波动率代理(无资金流历史时;资金流积累后可加成交额维度)。
# 复用 low_volatility_20d raw(window=60)。指数资产专用,无 industry_history 分量。
profile_id: volatility_60d_low_v2
version: 1
raw_metric:
  id: low_volatility_20d
  params: {window: 60, price_basis: qfq, variance_ddof: 0}
direction: lower_is_better
raw_unit: annualized_vol_percent
mapping:
  mode: hybrid
  components:
    absolute:
      weight: 0.5
      knots: [[5, 90], [10, 75], [25, 50], [40, 25], [60, 0]]
    market_history:
      weight: 0.3
      state: rolling
      years: 3
      sampling: weekend_cross_section
      min_observations: 3000
    self_history:
      weight: 0.2
      state: rolling
      years: 3
      sampling: month_end
      min_observations: 24
formal_requires_mature: true
missing_policy: shrink_to_50_and_block_if_critical
valid_from: 2013-01-01
