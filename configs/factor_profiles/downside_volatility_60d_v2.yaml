# 下行波动(半方差)60 日年化(%,Sortino 分母)。低 → 防御占优。
# 与 low_volatility(总波动)正交:总波动相同但下行更小者更优。
profile_id: downside_volatility_60d_v2
version: 1
raw_metric:
  id: downside_volatility
  params: {window: 60, price_basis: qfq}
direction: lower_is_better
raw_unit: annualized_downside_vol_percent
mapping:
  mode: hybrid
  components:
    absolute:
      weight: 0.4
      knots: [[0, 100], [5, 90], [10, 80], [20, 60], [35, 35], [60, 0]]
    market_history:
      weight: 0.4
      state: rolling
      years: 5
      sampling: weekend_cross_section
      min_observations: 3000
    self_history:
      weight: 0.2
      state: rolling
      years: 3
      sampling: month_end
      min_observations: 24
formal_requires_mature: true
missing_policy: shrink_to_50_and_block_if_critical
valid_from: 2007-01-01
