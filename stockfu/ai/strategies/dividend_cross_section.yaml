version: 1
name: 红利横截面(高股息+低波+价值)
# 同 dividend_low_vol 三因子,改用 cap_and_rank 横截面范式(对照 top_n_picker 锁仓版)。
# 每期全市场按 dividend_yield+low_volatility+value 打分,百分位×confidence 竞争 max_gross,
# 无 20 日锁仓、conf_gate=0、冷却短 → 测「红利因子 + 真横截面满仓」是否优于半仓 top_n。
# 数据依赖:dividend_event(见 --backfill-dividend)。
# 满仓刻度 score_full=8(dividend 20×1.0 + low_vol 20×0.8 + value 20×0.6 = 40,8/40=20% 满仓)。
operators:
  - {id: dividend_yield,  type: math, weight: 1.0, params: {high_yield: 5.0, price_basis: raw, yield_cap: 20.0}}
  - {id: low_volatility,  type: math, weight: 0.8, params: {window: 20, hist_years: 3}}
  - {id: value,           type: math, weight: 0.6, params: {years: 5}}
aggregate:
  method: weighted_sum
  thresholds: {strong_buy: 12, buy: 4, hold: -4, sell: -12}
position:
  mode: continuous
  max_w: 0.05           # 单只5%,与 cross_section_factor 对齐(满仓约 19 只)
  dead: 3.0
  score_full: 8
debounce:
  buy_cool_down_days: 1
  sell_cooldown_days: 1
  max_target_step: 1.0
  risk_confirm_days: 1
  min_trade_weight: 0.01
  conf_gate: 0.0
