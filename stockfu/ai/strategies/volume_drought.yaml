version: 1
name: 量能枯竭反转横截面(缩量企稳优先)
# 2026-08 网络调研第 2 批:量能趋势因子(短/长均成交额比)。缩量到极致 =
# 抛压枯竭、多空收敛,阶段性底部特征;放量到极致 = 情绪过热。与 low_turnover
# (换手率水平,截面横向)不同:度量个股自身量能的时间序列趋势,独立维度。
operators:
  - {id: volume_drought, type: math, weight: 1.0, params: {short: 5, long: 120, hist_years: 3}}
aggregate:
  method: weighted_sum
  thresholds: {strong_buy: 12, buy: 4, hold: -4, sell: -12}
position:
  mode: continuous
  max_w: 0.20
  dead: 3.0
  score_full: 8
debounce:
  buy_cool_down_days: 1
  sell_cooldown_days: 1
  max_target_step: 1.0
  risk_confirm_days: 1
  min_trade_weight: 0.01
  conf_gate: 0.0
risk:
  stop_loss: 0
  portfolio_brake: 0
  max_gross: 1.0
