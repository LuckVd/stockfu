version: 1
name: 负偏度防御横截面(规避彩票型收益)
# 2026-08 网络调研第 2 批:偏度因子(A 股定价实证:总/特质偏度,混频分位数回归)。
# 收益分布偏度低(负偏、少彩票属性)的股票未被高估 → 未来收益高。
# 与 lottery_max(单日最大涨幅,一阶矩)不同,本因子用三阶矩,独立维度。
operators:
  - {id: downside_skewness, type: math, weight: 1.0, params: {window: 60, hist_years: 3}}
aggregate:
  method: weighted_sum
  thresholds: {strong_buy: 12, buy: 4, hold: -4, sell: -12}
position:
  mode: continuous
  max_w: 0.20
  dead: 3.0
  score_full: 8
debounce:
  buy_cool_down_days: 1
  sell_cooldown_days: 1
  max_target_step: 1.0
  risk_confirm_days: 1
  min_trade_weight: 0.01
  conf_gate: 0.0
risk:
  stop_loss: 0
  portfolio_brake: 0
  max_gross: 1.0
