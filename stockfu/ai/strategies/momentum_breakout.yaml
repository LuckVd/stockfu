version: 1
name: 月线动量突破
# 真实行为(实测确认,2026-07):动量 + 趋势主导选股,月线布林仅作弱反向权重。
# 动量 raw_score 不封顶(ret×2)+ 趋势满格 ±20,加权后盖过月线布林(最多 ±7.2),
# 故选出的全是 20 日最强动量股(布林多在喊 sell)。配合 top_n_picker 锁仓 20 天顺势吃趋势。
# ⚠️ 这是动量追涨策略,不是均值回归;真正买超卖的见 bollinger_reversion。
operators:
  - {id: monthly_bollinger, type: math, weight: 1.2, params: {window: 20, std_dev: 2.0}}
  - {id: momentum, type: math, weight: 0.6, params: {window: 20}}
  - {id: trend_strength, type: math, weight: 0.4}

aggregate:
  method: weighted_sum
  thresholds: {strong_buy: 10, buy: 4, hold: -4, sell: -10}

position:
  mode: continuous
  max_w: 0.15
  dead: 3.0
  targets: {strong_buy: 0.15, buy: 0.10, hold: ~, sell: 0.0, strong_sell: 0.0}

debounce:
  buy_cool_down_days: 5
  max_target_step: 0.3
  risk_confirm_days: 1
  min_trade_weight: 0.01
  sell_cooldown_days: 3
  conf_gate: 0.3
