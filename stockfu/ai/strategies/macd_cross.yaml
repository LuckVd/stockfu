version: 1
name: MACD金叉死叉
# 单算子: 日/周 MACD 金叉买入,死叉卖出。全数学,不调 LLM → 回测秒级。
# 连续映射: macd_cross 离散 score({±10,±7,±5,0}) 经 weighted_sum 加权(total=score×1)
# → _total_to_weight 连续映射到仓位(total≥score_full 满仓)。
operators:
  - {id: macd_cross, type: math, weight: 1.0, params: {fast: 12, slow: 26, signal: 9}}
aggregate:
  method: weighted_sum
  # total_score → final_signal 派生标签(仅供展示;仓位决策走 continuous 连续映射):
  #   >= 8  → strong_buy / >= 4 → buy / >= -4 → hold / >= -8 → sell / < -8 → strong_sell
  thresholds: {strong_buy: 8, buy: 4, hold: -4, sell: -8}
position:
  mode: continuous         # 连续映射(discrete 模式已下线)
  max_w: 0.10              # 单只最大10%
  dead: 3.0                # (-3,3) 死区维持(score=0=hold 不动)
  score_full: 10           # 满仓刻度(macd_cross 满强度 score=10 → 满仓 10%)
debounce:
  buy_cool_down_days: 3    # 买入后至少等3天
  max_target_step: 1.0     # 不限单步加仓幅度
  risk_confirm_days: 1
  min_trade_weight: 0.01
  sell_cooldown_days: 0
  conf_gate: 0.0
