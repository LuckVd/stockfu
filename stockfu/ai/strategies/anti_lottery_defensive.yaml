version: 1
name: 反彩票防御横截面(规避MAX+低波+低估)
# Bali-Cakici-Whitelaw(2011)MAX 效应:最大日收益率高的「彩票型」票未来系统性跑输
# (散户彩票偏好)。本策略**反向**用 lottery_max(高 MAX→负分)剔除彩票股,叠加低波 +
# 低估做防御多头。三因子:lottery_max(主,负向罚)+ low_volatility + value。
# 横截面排序后,彩票股得强负分被排除,非彩票防御票(low_vol+value 正分)优先建仓。
# 数据依赖:close_qfq + PE/PB。
operators:
  - {id: lottery_max,     type: math, weight: 1.0, params: {window: 20, warn_max: 5.0, flag_max: 8.0}}
  - {id: low_volatility,  type: math, weight: 0.8, params: {window: 20, hist_years: 3}}
  - {id: value,           type: math, weight: 0.6, params: {years: 5}}
aggregate:
  method: weighted_sum
  thresholds: {strong_buy: 12, buy: 4, hold: -4, sell: -12}
position:
  mode: continuous
  max_w: 0.20
  dead: 3.0
  score_full: 8
debounce:
  buy_cool_down_days: 1
  sell_cooldown_days: 1
  max_target_step: 1.0
  risk_confirm_days: 1
  min_trade_weight: 0.01
  conf_gate: 0.0
risk:
  # Bali-Cakici-Whitelaw(2011)MAX 效应原文:横截面因子,无止损/无刹车,等权满仓;stop_loss=0,max_gross=1.0。
  stop_loss: 0
  max_gross: 1.0
