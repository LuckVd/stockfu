version: 1
name: 纯因子动量反转
# 全数学算子,不调 LLM → 回测秒级、不写 ai_report。验证"快速路径 + 算子组合"。
operators:
  - {id: momentum, type: math, weight: 1.5, params: {window: 20}}
  - {id: mean_reversion, type: math, weight: 1.0, params: {rsi_period: 14, oversold: 30, overbought: 70}}
  - {id: trend_strength, type: math, weight: 1.0}
  - {id: value, type: math, weight: 0.8}
aggregate:
  method: weighted_sum
  thresholds: {strong_buy: 12, buy: 4, hold: -4, sell: -12}
position: {mode: continuous, max_w: 0.12, dead: 2.5}
debounce:
  buy_cool_down_days: 3
  max_target_step: 1.0
  risk_confirm_days: 1
  min_trade_weight: 0.01
  sell_cooldown_days: 0
  conf_gate: 0.0
