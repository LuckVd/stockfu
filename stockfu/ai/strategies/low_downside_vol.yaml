version: 1
name: 低下行波动横截面(半方差防御)
# 2026-08 网络调研第 2 批:下行波动因子(半方差,Sortino 分母维度)。
# 与 low_volatility(总波动)互补:只度量下行一侧波动,风险厌恶投资者真正
# 关心的风险维度。下行波动低 → 风险调整后收益占优。
operators:
  - {id: downside_volatility, type: math, weight: 1.0, params: {window: 60, hist_years: 3}}
aggregate:
  method: weighted_sum
  thresholds: {strong_buy: 12, buy: 4, hold: -4, sell: -12}
position:
  mode: continuous
  max_w: 0.20
  dead: 3.0
  score_full: 8
debounce:
  buy_cool_down_days: 1
  sell_cooldown_days: 1
  max_target_step: 1.0
  risk_confirm_days: 1
  min_trade_weight: 0.01
  conf_gate: 0.0
risk:
  stop_loss: 0
  portfolio_brake: 0
  max_gross: 1.0
