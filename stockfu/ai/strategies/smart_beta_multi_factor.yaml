version: 1
name: 智能贝塔多因子横截面(分散因子暴露)
# Smart Beta 思路:分散暴露多个低相关因子,降低单因子回撤与拥挤度。复合 5 因子——
# fifty_two_week_high(趋势锚定)+ low_volatility(防御)+ value(低估)+ low_turnover
# (流动性)+ graham_value(深价值复合)。各因子权重偏低、互不主导,横截面综合排序选
# 多因子兼顾的票。cap_and_rank 竞争 max_gross。数据依赖:close + PE/PB + turnover + 股息。
# **注**:多因子分散会平滑超额收益(各因子互相稀释),目标是稳健 Sharpe 而非单期最高收益。
operators:
  - {id: fifty_two_week_high, type: math, weight: 0.6, params: {lookback: 250, lo: 0.70}}
  - {id: low_volatility,      type: math, weight: 0.8, params: {window: 20, hist_years: 3}}
  - {id: value,               type: math, weight: 0.6, params: {years: 5}}
  - {id: low_turnover,        type: math, weight: 0.6, params: {window: 20}}
  - {id: graham_value,        type: math, weight: 0.4, params: {years: 5}}
aggregate:
  method: weighted_sum
  thresholds: {strong_buy: 12, buy: 4, hold: -4, sell: -12}
position:
  mode: continuous
  max_w: 0.20
  dead: 3.0
  score_full: 10            # 5 因子总分更高(score_full 略上调保持满仓门槛)
debounce:
  buy_cool_down_days: 1
  sell_cooldown_days: 1
  max_target_step: 1.0
  risk_confirm_days: 1
  min_trade_weight: 0.01
  conf_gate: 0.0
risk:
  # 多因子原文无止损/无刹车,靠分散+定期再平衡,等权满仓;stop_loss=0,max_gross=1.0。
  stop_loss: 0
  portfolio_brake: 0
  max_gross: 1.0
