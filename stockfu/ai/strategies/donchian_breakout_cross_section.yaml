version: 1
name: 唐奇安突破横截面(通道突破+趋势确认)
# 海龟交易系统核心:唐奇安通道(近 N 日最高/最低)突破上轨 → 趋势确立。
# 三因子:donchian_breakout(主,通道位置)+ ts_momentum(风险调整趋势)+ trend_strength
# (多头排列)。cap_and_rank 横截面选突破且趋势强的票。区别于 momentum_breakout(月线
# 布林突破 + top_n 锁仓):本策略是日线通道 + 横截面纪律换仓。数据依赖:close_qfq。
operators:
  - {id: donchian_breakout, type: math, weight: 1.0, params: {window: 20, buy_pos: 0.8, sell_pos: 0.2}}
  - {id: ts_momentum,       type: math, weight: 0.6, params: {window: 120}}
  - {id: trend_strength,    type: math, weight: 0.4}
aggregate:
  method: weighted_sum
  thresholds: {strong_buy: 12, buy: 4, hold: -4, sell: -12}
position:
  mode: continuous
  max_w: 0.20
  dead: 3.0
  score_full: 8
debounce:
  buy_cool_down_days: 1
  sell_cooldown_days: 1
  max_target_step: 1.0
  risk_confirm_days: 1
  min_trade_weight: 0.01
  conf_gate: 0.0
risk:
  # 海龟原文:入场 2N(20日ATR)止损,A 股单票约折 15-20% → 0.18;趋势中按 ATR 倍数追踪离场(≈跌破通道)。
  stop_loss: 0.18
  max_gross: 1.0
  take_profit:
    atr_trailing:
      period: 20
      tiers:
        - {profit: 0.10, multiple: 2.5, sell_fraction: 0.5}
        - {profit: 0.20, multiple: 2.0, sell_fraction: 0.5}
