version: 1
name: 红利横截面(分段止盈+分级敞口刹车+回撤加仓质量门控)
# 融合候选:浅回调(tiers 0.95)保持近满仓并放大 strong_buy ×1.2(保留近5年 alpha),
# 深回调(tiers 0.80→0.65→0.50)强制降组合总敞口(2008 保护);权益创出 63 日新高解除。
# 验证结论见 docs/BACKTEST.md §0.6.2。
operators:
  - {id: dividend_yield, type: math, weight: 1.0, params: {high_yield: 5.0, price_basis: raw, yield_cap: 20.0}}
  - {id: low_volatility, type: math, weight: 0.8, params: {window: 20, hist_years: 3}}
  - {id: value, type: math, weight: 0.6, params: {years: 5}}
aggregate:
  method: weighted_sum
  thresholds: {strong_buy: 12, buy: 4, hold: -4, sell: -12}
position:
  mode: continuous
  max_w: 0.05
  dead: 3.0
  score_full: 8
debounce:
  buy_cool_down_days: 1
  sell_cooldown_days: 1
  max_target_step: 1.0
  risk_confirm_days: 1
  min_trade_weight: 0.01
  conf_gate: 0.0
risk:
  stop_loss: 0.30
  portfolio_brake: 0.08
  portfolio_brake_scale: 1.20
  portfolio_brake_add_min_score: 12.0
  portfolio_brake_recover_high_days: 63
  portfolio_brake_tiers:
    - {drawdown: 0.08, max_gross: 0.95}
    - {drawdown: 0.12, max_gross: 0.80}
    - {drawdown: 0.20, max_gross: 0.65}
    - {drawdown: 0.30, max_gross: 0.50}
  take_profit:
    trailing:
      - {profit: 0.20, drawdown: 0.05, sell_fraction: 0.3333333333}
      - {profit: 0.30, drawdown: 0.03, sell_fraction: 0.3333333333}
    hard_profit: null
