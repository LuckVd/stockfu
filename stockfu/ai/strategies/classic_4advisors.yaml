version: 1
name: 经典4顾问(等价现状)
# 等价重构前的 4 顾问系统:4 LLM + risk 一票否决 + discrete 仓位 + 默认去抖。
# 用于迁移期等价性验证(classic 回测结果须与重构前逐笔一致)。
operators:
  - {id: trend, type: llm, weight: 1.0}
  - {id: contrarian, type: llm, weight: 1.0}
  - {id: risk, type: llm, weight: 1.0, veto_role: true}
  - {id: valuation, type: llm, weight: 1.0}
aggregate:
  method: risk_veto
position: {mode: discrete, max_w: 0.15, dead: 3.0}
debounce:
  buy_cool_down_days: 5
  max_target_step: 1.0
  risk_confirm_days: 1
  min_trade_weight: 0.0
  sell_cooldown_days: 0
  conf_gate: 0.0
