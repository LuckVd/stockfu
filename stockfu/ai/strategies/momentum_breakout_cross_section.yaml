version: 1
name: 动量突破横截面(月布林+动量+趋势)
# 同 momentum_breakout 三因子,只换选股层为 cap_and_rank(对照 top_n 追涨版)。
# 注意:monthly_bollinger 缓存为空,首次全周期会长时间冷补。
operators:
  - {id: monthly_bollinger, type: math, weight: 1.2, params: {window: 20, std_dev: 2.0}}
  - {id: momentum,          type: math, weight: 0.6, params: {window: 20}}
  - {id: trend_strength,    type: math, weight: 0.4}
aggregate:
  method: weighted_sum
  thresholds: {strong_buy: 10, buy: 4, hold: -4, sell: -10}
position:
  mode: continuous
  max_w: 0.05
  dead: 3.0
  score_full: 8
debounce:
  buy_cool_down_days: 1
  sell_cooldown_days: 1
  max_target_step: 1.0
  risk_confirm_days: 1
  min_trade_weight: 0.01
  conf_gate: 0.0
