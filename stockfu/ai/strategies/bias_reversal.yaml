version: 1
name: 乖离率反转横截面(深度超跌优先)
# 2026-08 网络调研第 2 批:乖离率 BIAS 因子(价格偏离均线幅度,负乖离=超跌 →
# 均值回归)。与 52周高点因子(追涨)相反,是「价格-均线距离」独立均值回归维度。
operators:
  - {id: bias_reversal, type: math, weight: 1.0, params: {window: 20, hist_years: 3}}
aggregate:
  method: weighted_sum
  thresholds: {strong_buy: 12, buy: 4, hold: -4, sell: -12}
position:
  mode: continuous
  max_w: 0.20
  dead: 3.0
  score_full: 8
debounce:
  buy_cool_down_days: 1
  sell_cooldown_days: 1
  max_target_step: 1.0
  risk_confirm_days: 1
  min_trade_weight: 0.01
  conf_gate: 0.0
risk:
  stop_loss: 0
  portfolio_brake: 0
  max_gross: 1.0
