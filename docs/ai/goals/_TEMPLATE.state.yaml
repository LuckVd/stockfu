# goals/<goal-id>.state.yaml 模板
# 复制本模板到 goals/<goal-id>.state.yaml 填写。<goal-id> 对应 roadmap 的 目标ID/子目标ID。
# 字段保持扁平,无嵌套。枚举值见下方注释。

goal_id: null            # 如 G02-S01
title: null
stage: empty             # 枚举: empty | discover | options | design | confirm_plan
                         #        | ready_to_claim | claimed | implementing
                         #        | ready_for_review | reviewing | sync | done
                         #        | blocked | dropped
selected_option: null    # 用户从候选中选定的方案
design_confirmed: false  # 用户是否已确认方案(进入 ready_to_claim 前必须为 true)

# --- 并行编排(新增)---
owner: null              # 领取该目标的实例 id,如 executor-1;null 表示可领取
role: null               # orchestrator | executor
worktree: null           # 如 .claude/worktrees/g02-s01/
branch: null             # 如 goal/g02-s01
merge_status: not_applicable  # 枚举: not_applicable | pending_review | review_passed
                              #        | merging | merged | merge_conflict | rejected
claimed_at: null         # 执行者领取时间(ISO8601),用于僵尸领取检测
ready_for_review_at: null # 执行者完工 parking 时间(ISO8601)

# --- 设计与执行 ---
blocked_by: []           # 阻塞来源(引用依赖编号或问题描述)
open_questions: []       # 待澄清的歧义点
implementation_steps: [] # 实现步骤
test_scope: []           # 测试范围 / 测试计划条目
goal_candidates: []      # 候选目标(领取后通常清空)

# --- 审计时间戳 ---
last_check_at: null
last_security_scan_at: null
last_deadcode_scan_at: null
last_synced_at: null
