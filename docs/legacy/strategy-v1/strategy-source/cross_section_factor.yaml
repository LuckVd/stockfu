version: 1
name: 横截面多因子(反转+低波+价值)
# 横截面 rank 范式 —— 区别于项目 9 个「时间序列轮动」策略(均用 top_n_picker 锁仓追强势):
# 每期全市场按 reversal+low_volatility+value 三因子打分排序,cap_and_rank rebalancer 按横截面
# 百分位×confidence 竞争 max_gross 额度,头部高分股优先建仓、尾部砍仓。
# 无锁仓、纯纪律换仓,适合震荡市(A 股常态)。
# 因子选反转+低波+价值(A 股实证长期有效),非动量(项目已多次证伪)。
# 满仓刻度 score_full=8(reversal 20×1.0 + low_vol 20×0.8 + value 20×0.6 = 40,8/40=20% 满仓)。
operators:
  - {id: reversal,        type: math, weight: 1.0, params: {window: 20}}
  - {id: low_volatility,  type: math, weight: 0.8, params: {window: 20, hist_years: 3}}
  - {id: value,           type: math, weight: 0.6, params: {years: 5}}
aggregate:
  method: weighted_sum
  thresholds: {strong_buy: 12, buy: 4, hold: -4, sell: -12}
position:
  mode: continuous
  max_w: 0.05           # 单只5%,分散持仓 ~19 只(max_gross 0.95 / 0.05)
  dead: 3.0
  score_full: 8
debounce:
  buy_cool_down_days: 1   # 横截面纪律换仓要灵活,冷却短(区别于轮动的锁仓)
  sell_cooldown_days: 1
  max_target_step: 1.0    # 不限单步幅度,允许一次到位
  risk_confirm_days: 1
  min_trade_weight: 0.01
  conf_gate: 0.0
