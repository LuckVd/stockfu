version: 1
name: RSI超卖反转横截面(低RSI优先)
# 2026-08 网络调研第 2 批:RSI 超卖反转因子(单边行情极端值反转,可扩展为横截面
# 选股因子)。与已有反转(low_turnover_reversal 换手+反转、reversal 收益反转)
# 不同:基于 RSI 相对强弱指标,独立技术维度。
operators:
  - {id: rsi_reversal, type: math, weight: 1.0, params: {window: 14, hist_years: 3}}
aggregate:
  method: weighted_sum
  thresholds: {strong_buy: 12, buy: 4, hold: -4, sell: -12}
position:
  mode: continuous
  max_w: 0.20
  dead: 3.0
  score_full: 8
debounce:
  buy_cool_down_days: 1
  sell_cooldown_days: 1
  max_target_step: 1.0
  risk_confirm_days: 1
  min_trade_weight: 0.01
  conf_gate: 0.0
risk:
  stop_loss: 0
  portfolio_brake: 0
  max_gross: 1.0
