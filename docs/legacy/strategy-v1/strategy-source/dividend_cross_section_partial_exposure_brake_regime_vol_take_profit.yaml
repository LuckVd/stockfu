version: 1
name: 红利横截面(分段止盈+深度刹车+波动率定权)
# base(敞口刹车深度分级)+ 大盘 regime 门禁(仅 vol 信号):
# 近 63 交易日沪深300 已实现波动率(年化)缩放总敞口,target_vol=0.15,下限 0.30。
# 波动率飙升(vol cluster)即压敞口,领先回撤;平静期满仓。
operators:
  - {id: dividend_yield, type: math, weight: 1.0, params: {high_yield: 5.0, price_basis: raw, yield_cap: 20.0}}
  - {id: low_volatility, type: math, weight: 0.8, params: {window: 20, hist_years: 3}}
  - {id: value, type: math, weight: 0.6, params: {years: 5}}
aggregate:
  method: weighted_sum
  thresholds: {strong_buy: 12, buy: 4, hold: -4, sell: -12}
position:
  mode: continuous
  max_w: 0.05
  dead: 3.0
  score_full: 8
debounce:
  buy_cool_down_days: 1
  sell_cooldown_days: 1
  max_target_step: 1.0
  risk_confirm_days: 1
  min_trade_weight: 0.01
  conf_gate: 0.0
risk:
  stop_loss: 0.30
  portfolio_brake: 0.08
  portfolio_brake_scale: 1.0
  portfolio_brake_recover_high_days: 63
  portfolio_brake_tiers:
    - {drawdown: 0.08, max_gross: 0.85}
    - {drawdown: 0.12, max_gross: 0.75}
    - {drawdown: 0.20, max_gross: 0.60}
    - {drawdown: 0.30, max_gross: 0.45}
  market_regime_code: sh000300
  market_regime_target_vol: 0.15
  market_regime_vol_window: 63
  market_regime_vol_floor: 0.30
  take_profit:
    trailing:
      - {profit: 0.20, drawdown: 0.05, sell_fraction: 0.3333333333}
      - {profit: 0.30, drawdown: 0.03, sell_fraction: 0.3333333333}
    hard_profit: null
