version: 1
name: 个股动量横截面(动量+线性度+趋势)
# 同 cn_momentum_rotation 三因子,只换选股层为 cap_and_rank(对照 top_n+lock20 已证伪版)。
# 测「动量因子 + 真横截面满仓」是否仍无效,还是 top_n 半仓掩盖了 β。
operators:
  - {id: momentum,         type: math, weight: 1.0, params: {window: 20}}
  - {id: trend_linearity,  type: math, weight: 0.6, params: {window: 20}}
  - {id: trend_strength,   type: math, weight: 0.4}
aggregate:
  method: weighted_sum
  thresholds: {strong_buy: 12, buy: 4, hold: -4, sell: -12}
position:
  mode: continuous
  max_w: 0.05
  dead: 3.0
  score_full: 8
debounce:
  buy_cool_down_days: 1
  sell_cooldown_days: 1
  max_target_step: 1.0
  risk_confirm_days: 1
  min_trade_weight: 0.01
  conf_gate: 0.0
