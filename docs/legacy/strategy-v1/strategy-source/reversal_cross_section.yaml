version: 1
name: 反转横截面(短期反转+RSI+低估)
# 同 reversal_strategy 三因子,只换选股层为 cap_and_rank(对照 top_n+lock20)。
# 因子不动:reversal 主信号 + mean_reversion(RSI) + value。
# 横截面:单只5%、无锁仓、conf_gate=0、冷却短 → 满仓竞争 max_gross。
operators:
  - {id: reversal,        type: math, weight: 1.0, params: {window: 20}}
  - {id: mean_reversion,  type: math, weight: 0.6, params: {rsi_period: 14, oversold: 30, overbought: 70}}
  - {id: value,           type: math, weight: 0.4, params: {years: 5}}
aggregate:
  method: weighted_sum
  thresholds: {strong_buy: 12, buy: 4, hold: -4, sell: -12}
position:
  mode: continuous
  max_w: 0.05
  dead: 3.0
  score_full: 8
debounce:
  buy_cool_down_days: 1
  sell_cooldown_days: 1
  max_target_step: 1.0
  risk_confirm_days: 1
  min_trade_weight: 0.01
  conf_gate: 0.0
