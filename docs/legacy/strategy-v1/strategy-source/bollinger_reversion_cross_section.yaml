version: 1
name: 布林回归横截面(日+周布林+RSI)
# 同 bollinger_reversion 四因子,只换选股层为 cap_and_rank(对照 top_n 版)。
# 注意:日/周布林算子缓存偏冷,首次全周期会长时间冷补。
operators:
  - {id: daily_bollinger,  type: math, weight: 1.0, params: {window: 20, std_dev: 2.0, buy_max: 0.45, sell_min: 0.55}}
  - {id: weekly_bollinger, type: math, weight: 0.6, params: {window: 20, std_dev: 2.0, buy_max: 0.45, sell_min: 0.55}}
  - {id: mean_reversion,   type: math, weight: 0.4, params: {rsi_period: 14, oversold: 30, overbought: 70}}
  - {id: trend_strength,   type: math, weight: 0.2}
aggregate:
  method: weighted_sum
  thresholds: {strong_buy: 8, buy: 3, hold: -3, sell: -8}
position:
  mode: continuous
  max_w: 0.05
  dead: 3.0
  score_full: 8
debounce:
  buy_cool_down_days: 1
  sell_cooldown_days: 1
  max_target_step: 1.0
  risk_confirm_days: 1
  min_trade_weight: 0.01
  conf_gate: 0.0
