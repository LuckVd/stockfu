version: 1
name: 红利横截面(分段止盈+分级敞口刹车+买卖不对称滞回)
# 买卖不对称滞回:买入/持仓等权(1/1/1)算买入总分、卖出(2/1/2,低波降权/基本面升权)
# 算卖出总分,各自归一化到 ±100;持仓时卖出总分跌破 -5 才清仓(买入线仍 +5),分数小降不追卖;
# 组合总敞口封顶 max_gross=0.80(留 2 成现金供高分票加仓);冷却 30 交易日。
# 验证结论见 docs/BACKTEST.md §0.6.3。
operators:
  - {id: dividend_yield, type: math, weight: 1.0, params: {high_yield: 5.0, price_basis: raw, yield_cap: 20.0}}
  - {id: low_volatility, type: math, weight: 1.0, params: {window: 20, hist_years: 3}}
  - {id: value, type: math, weight: 1.0, params: {years: 5}}
aggregate:
  method: weighted_sum
  thresholds: {strong_buy: 12, buy: 4, hold: -4, sell: -12}
  sell_weights:
    dividend_yield: 2.0
    low_volatility: 1.0
    value: 2.0
position:
  mode: continuous
  max_w: 0.05
  dead: 5.0
  score_full: 8
debounce:
  buy_cool_down_days: 30
  sell_cooldown_days: 30
  max_target_step: 1.0
  risk_confirm_days: 1
  min_trade_weight: 0.01
  conf_gate: 0.0
risk:
  max_gross: 0.80
  stop_loss: 0.30
  portfolio_brake: 0.08
  portfolio_brake_scale: 1.0
  portfolio_brake_recover_high_days: 63
  portfolio_brake_tiers:
    - {drawdown: 0.08, max_gross: 0.85}
    - {drawdown: 0.12, max_gross: 0.75}
    - {drawdown: 0.20, max_gross: 0.60}
    - {drawdown: 0.30, max_gross: 0.45}
  take_profit:
    trailing:
      - {profit: 0.20, drawdown: 0.05, sell_fraction: 0.3333333333}
      - {profit: 0.30, drawdown: 0.03, sell_fraction: 0.3333333333}
    hard_profit: null
