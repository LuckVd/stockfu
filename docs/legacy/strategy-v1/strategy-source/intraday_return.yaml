version: 1
name: 日内动量横截面(高日内收益优先)
# 2026-08 网络调研第 2 批:日内收益因子(A股日内正溢价,与隔夜因子互补)。
# 配置:满仓+等权+无止损(与三跑门禁 §0.6.6 同款,便于横向对比)。
operators:
  - {id: intraday_return, type: math, weight: 1.0}
aggregate:
  method: weighted_sum
  thresholds: {strong_buy: 12, buy: 4, hold: -4, sell: -12}
position:
  mode: continuous
  max_w: 0.20
  dead: 3.0
  score_full: 8
debounce:
  buy_cool_down_days: 1
  sell_cooldown_days: 1
  max_target_step: 1.0
  risk_confirm_days: 1
  min_trade_weight: 0.01
  conf_gate: 0.0
risk:
  stop_loss: 0
  portfolio_brake: 0
  max_gross: 1.0
