version: 1
name: 红利横截面(滞后ATR分段减仓止盈)
# 独立于固定回撤与当日 ATR 候选；止盈门槛使用前一交易日已完成的 ATR(20)，
# 避免下跌当天波动扩大同时把止盈门槛抬高。
operators:
  - {id: dividend_yield, type: math, weight: 1.0, params: {high_yield: 5.0, price_basis: raw, yield_cap: 20.0}}
  - {id: low_volatility, type: math, weight: 0.8, params: {window: 20, hist_years: 3}}
  - {id: value, type: math, weight: 0.6, params: {years: 5}}
aggregate:
  method: weighted_sum
  thresholds: {strong_buy: 12, buy: 4, hold: -4, sell: -12}
position:
  mode: continuous
  max_w: 0.05
  dead: 3.0
  score_full: 8
debounce:
  buy_cool_down_days: 1
  sell_cooldown_days: 1
  max_target_step: 1.0
  risk_confirm_days: 1
  min_trade_weight: 0.01
  conf_gate: 0.0
risk:
  stop_loss: 0.30
  take_profit:
    atr_trailing:
      period: 20
      lagged: true
      tiers:
        - {profit: 0.20, multiple: 2.0, sell_fraction: 0.3333333333}
        - {profit: 0.30, multiple: 1.25, sell_fraction: 0.3333333333}
    hard_profit: null
