version: 1
name: 残差反转横截面(市场调整后超跌优先)
# 2026-08 网络调研第 2 批:残差反转因子(Daniel-Titman特质收益反转)。
# 配置:满仓+等权+无止损(与三跑门禁 §0.6.6 同款,便于横向对比)。
operators:
  - {id: residual_reversal, type: math, weight: 1.0}
aggregate:
  method: weighted_sum
  thresholds: {strong_buy: 12, buy: 4, hold: -4, sell: -12}
position:
  mode: continuous
  max_w: 0.20
  dead: 3.0
  score_full: 8
debounce:
  buy_cool_down_days: 1
  sell_cooldown_days: 1
  max_target_step: 1.0
  risk_confirm_days: 1
  min_trade_weight: 0.01
  conf_gate: 0.0
risk:
  stop_loss: 0
  portfolio_brake: 0
  max_gross: 1.0
