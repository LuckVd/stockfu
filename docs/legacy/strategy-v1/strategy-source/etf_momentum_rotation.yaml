version: 1
name: ETF动量轮动
# 宽基+行业 ETF 池动量轮动:momentum(涨多少)+trend_linearity(涨得稳,r²×方向)+trend_strength(MA多头确认)。
# 三因子打分,top_n_picker 选 top 5 等权 + lock 20 天锁仓降换手。
# ETF 摩擦远小于个股(无印花税、流动性好、无涨跌停板),动量效应更纯粹 ——
# 记忆 cn-momentum-rotation-backtest 明确记「ETF→个股摩擦翻转」,故 ETF 版可能成立。
# 标的池:etf_quote_daily 宽基+行业 ETF;走 strict=False(ETF 无 ST/次新/停牌概念)。
# 满仓刻度 score_full=8(三算子满强度合计 20×(1.0+0.6+0.4)=40,8/40=20% 强度即满仓)。
operators:
  - {id: momentum,         type: math, weight: 1.0, params: {window: 20}}
  - {id: trend_linearity,  type: math, weight: 0.6, params: {window: 20}}
  - {id: trend_strength,   type: math, weight: 0.4}
aggregate:
  method: weighted_sum
  thresholds: {strong_buy: 12, buy: 4, hold: -4, sell: -12}
position:
  mode: continuous
  max_w: 0.18           # top_n=5 时单只 18%(5×0.18=0.90 满仓)
  dead: 3.0
  score_full: 8
debounce:
  buy_cool_down_days: 5
  sell_cooldown_days: 3
  max_target_step: 0.3
  risk_confirm_days: 1
  min_trade_weight: 0.01
  conf_gate: 0.3
