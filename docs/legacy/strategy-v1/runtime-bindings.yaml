schema_version: 1
rebalancer:
  active_rebalancer_id_default: pass_through
  rebalancer_params_default:
    max_gross: 0.9
    max_w: 0.1
  max_gross_precedence: yaml risk.max_gross（debounce.max_gross）> app_config rebalancer_params
    > engine DEFAULT_MAX_GROSS
  note: 回测 CLI 无 --rebalancer 参数；engine.run 内部 get_active_rebalancer()/get_rebalancer_params()
    读 app_config（stockfu/backtest/engine.py:1548）
universe:
  default: historical_indices（历史沪深300 宇宙）
  source: stockfu/services/index_universe.py HISTORICAL_INDEX_CODES / HISTORICAL_UNIVERSE_ID
  override: --codes 指定代码列表；--min-amount 过滤（main.py --backtest 分支）
engine_constants:
  initial_cash: 1000000.0
  commission_rate: 0.0003
  min_commission: 5.0
  stamp_duty_rate: 0.0005
  stamp_duty_rate_old: 0.001
  stamp_duty_cutoff: '2023-08-28'
  transfer_fee_rate: 1.0e-05
  slippage: 无显式滑点模型（以收盘价成交，见 engine 执行层）
  default_max_gross: 0.9
  default_stop_loss: 0.08
  default_portfolio_brake: 0.1
  default_portfolio_brake_scale: 0.5
entrypoints:
  backtest: python main.py --backtest <strategy_id> [--start --end --cash --codes
    --min-amount --save]
  recommend: python main.py --recommend --strategies <ids> [--as-of --cash]
  signal_mail: python main.py --signal-mail / scheduler jobs.run_signal_pipeline
  evaluate: python main.py --evaluate（stockfu/services/evaluator.py 自选股多策略评价矩阵）
  backfill_dividend: python main.py --backfill-dividend（dividend_yield 算子数据依赖）
data_dependencies:
  kline: 主库 data/stockfu.db 行情/分红/宇宙表
  operator_cache: data/operator_cache.db operator_result（可再生的单算子缓存，operator_id+params+fingerprint
    定位）
  dividend_events: dividend_event 表（--backfill-dividend 灌入）
strategies:
  momentum_breakout:
    base_id: momentum_breakout
    variant_key: null
    disposition: keep
    status: known
    rebalancer:
      id: top_n_picker
      params:
        top_n: 10
        lock_days: 20
        max_replace: 1
        max_w: 0.15
        max_gross: 0.9
      source: stockfu/backtest/full_cycle_update.py FULL_CYCLE_CATALOG
    universe:
      id: historical_indices
      min_amount: 50000000
      source: stockfu/backtest/full_cycle_update.py StrategyRunSpec
    cost_model: engine_constants
    entrypoints:
      backtest: python main.py --backtest <strategy_id>
      recommend: python main.py --recommend --strategies <strategy_id>
      signal_scan: stockfu/services/signal_scan.py
  cn_momentum_cross_section:
    base_id: cn_momentum_cross_section
    variant_key: null
    disposition: keep
    status: known
    rebalancer:
      id: cap_and_rank
      params:
        max_gross: 0.95
      source: stockfu/backtest/full_cycle_update.py FULL_CYCLE_CATALOG
    universe:
      id: historical_indices
      min_amount: 50000000
      source: stockfu/backtest/full_cycle_update.py StrategyRunSpec
    cost_model: engine_constants
    entrypoints:
      backtest: python main.py --backtest <strategy_id>
      recommend: python main.py --recommend --strategies <strategy_id>
      signal_scan: stockfu/services/signal_scan.py
  dual_bollinger:
    base_id: dual_bollinger
